# Alembic configuration for Purchase Order Automation (Backend).
#
# The database URL is resolved by app/database/migrations/env.py from the
# DATABASE_URL environment variable or the application settings
# (app/core/config.py). Migrations live under app/database/migrations
# (ADR-001: database layer owns migrations).

[alembic]
script_location = app/database/migrations
prepend_sys_path = .
# The sqlalchemy.url option is set programmatically by env.py; do not put
# credentials here.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
