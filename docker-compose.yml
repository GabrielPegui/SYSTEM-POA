# Development environment for Purchase Order Automation.
# Usage: docker compose up --build
name: purchase-order-automation

services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: poa-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
      MSSQL_PID: Developer
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: poa-backend
    environment:
      ENVIRONMENT: development
      APP_DEBUG: "true"
      DATABASE_URL: mssql+pyodbc://sa:PurchaseAuto%402026@mssql:1433/purchase_order?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes&Encrypt=no
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./Backend/app:/app/app
    depends_on:
      mssql:
        condition: service_healthy

volumes:
  mssql_data:
